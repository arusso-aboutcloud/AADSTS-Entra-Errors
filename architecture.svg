<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.2" fill="#3d4654"/>
    </marker>
    <!-- Icons: style attrs live on the <g id> itself, never a wrapping
         ancestor (<use> only clones the referenced element's own
         attributes). Defined inside <defs> so they render only via <use>,
         not a second time at their own definition point. -->
    <g id="doc-icon" stroke="#2496ed" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 2h9l4 4v16a1 1 0 0 1-1 1H3.9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/>
      <path d="M12 2v4h4"/>
      <line x1="6" y1="12" x2="14" y2="12"/>
      <line x1="6" y1="15.5" x2="14" y2="15.5"/>
      <line x1="6" y1="19" x2="11" y2="19"/>
    </g>
    <g id="bolt-icon" stroke="#f38020" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 2 L5 13.5h7l-1.2 8.5L18 10.5h-7z"/>
    </g>
    <g id="db-icon" stroke="#6e40c9" fill="none" stroke-width="1.4" stroke-linecap="round">
      <ellipse cx="10" cy="4" rx="8" ry="3"/>
      <path d="M2 4v14c0 1.7 3.6 3 8 3s8-1.3 8-3V4"/>
      <path d="M2 11c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
    </g>
    <g id="browser-icon" stroke="#3fb950" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="26" height="20" rx="2.5"/>
      <line x1="1" y1="7" x2="27" y2="7"/>
      <circle cx="5.5" cy="4" r="0.9" fill="#3fb950" stroke="none"/>
      <circle cx="9" cy="4" r="0.9" fill="#3fb950" stroke="none"/>
    </g>
    <g id="search-icon" stroke="#9aa4b2" fill="none" stroke-width="1.6" stroke-linecap="round">
      <circle cx="9" cy="9" r="6.5"/>
      <line x1="14" y1="14" x2="20" y2="20"/>
    </g>
  </defs>

  <rect width="620" height="480" rx="10" fill="#0a0d12"/>
  <rect x="0.5" y="0.5" width="619" height="479" rx="10" fill="none" stroke="#1c222c" stroke-width="1"/>

  <!-- Title -->
  <text x="32" y="36" fill="#e6edf3" font-size="17" font-weight="600">AADSTS Entra Errors</text>
  <text x="32" y="54" fill="#9aa4b2" font-size="11">349 error codes · Cloudflare Worker · cron every 6h</text>
  <line x1="32" y1="68" x2="588" y2="68" stroke="#1c222c" stroke-width="1"/>

  <!-- SOURCE -->
  <text x="32" y="90" fill="#9aa4b2" font-size="10" font-weight="600" letter-spacing="1.5">SOURCE</text>
  <g transform="translate(200,98)">
    <rect width="220" height="56" rx="7" fill="#12161d" stroke="#242b36"/>
    <use href="#doc-icon" transform="translate(14,14)"/>
    <text x="46" y="27" fill="#c9d1d9" font-weight="600" font-size="11">Microsoft Learn</text>
    <text x="46" y="42" fill="#9aa4b2" font-size="8.5">Entra ID error-codes reference page</text>
  </g>

  <path d="M310,154 L310,178" stroke="#2c3542" stroke-width="1.2" fill="none" marker-end="url(#dot)"/>

  <!-- PROCESSING -->
  <text x="32" y="196" fill="#9aa4b2" font-size="10" font-weight="600" letter-spacing="1.5">PROCESSING</text>
  <g transform="translate(32,204)">
    <rect width="556" height="70" rx="8" fill="#151009" stroke="#3a2410"/>
    <use href="#bolt-icon" transform="translate(18,17)"/>
    <text x="48" y="32" fill="#f38020" font-size="13" font-weight="700">Cloudflare Worker</text>
    <text x="48" y="48" fill="#9aa4b2" font-size="9.5">entra-errors · fetch + scheduled · parses, classifies, seeds fix hints</text>
  </g>

  <path d="M180,274 L180,290 Q180,300 220,300 L220,314" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>
  <path d="M440,274 L440,311 Q440,314 420,314 L400,314" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>

  <!-- STORAGE + DELIVERY -->
  <text x="32" y="308" fill="#9aa4b2" font-size="10" font-weight="600" letter-spacing="1.5">STORAGE</text>
  <text x="368" y="308" fill="#9aa4b2" font-size="10" font-weight="600" letter-spacing="1.5">DELIVERY</text>

  <g transform="translate(32,316)">
    <rect width="248" height="60" rx="8" fill="#160f22" stroke="#2c1c42"/>
    <use href="#db-icon" transform="translate(14,14) scale(0.85)"/>
    <text x="44" y="29" fill="#8f7bdb" font-size="11.5" font-weight="700">KV: ENTRA_ERRORS</text>
    <text x="44" y="43" fill="#9aa4b2" font-size="8.5">Codes · changelog · sync + health</text>
    <text x="44" y="55" fill="#6b7684" font-size="8">~240 KB · 349 codes</text>
  </g>

  <g transform="translate(340,316)">
    <rect width="248" height="60" rx="8" fill="#0a1710" stroke="#153322"/>
    <use href="#browser-icon" transform="translate(14,15)"/>
    <text x="52" y="29" fill="#3fb950" font-size="11.5" font-weight="700">Cloudflare Pages</text>
    <text x="52" y="43" fill="#9aa4b2" font-size="8.5">entraerrors.aboutcloud.io</text>
    <text x="52" y="55" fill="#6b7684" font-size="8">Fuse.js search · dark theme · JSON-LD</text>
  </g>

  <!-- No KV->Pages connector: KV and Pages are both parallel children of
       the Worker (cache write vs. static hosting), not a sequential
       relationship. There's nothing real to draw between them. -->
  <path d="M464,376 L464,408" stroke="#2c3542" stroke-width="1.1" fill="none" marker-end="url(#dot)"/>

  <!-- Users: given its own clear vertical band, well clear of both the
       Delivery box above it and the footer below it. Previously these
       three collided: Users' own text overlapped the footer caption,
       and the bottom line was clipped by the card's rounded corner. -->
  <g transform="translate(440,414)">
    <use href="#search-icon" transform="translate(0,1) scale(0.8)"/>
    <text x="24" y="11" fill="#c9d1d9" font-size="10.5" font-weight="600">Users</text>
    <text x="24" y="24" fill="#9aa4b2" font-size="8">Search · filter · classify</text>
  </g>

  <!-- Footer -->
  <text x="310" y="462" text-anchor="middle" fill="#6b7684" font-size="9">Auto-updated from Microsoft Learn · €0/month · Open Source</text>
</svg>
